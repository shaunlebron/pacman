<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ms. Pac-Man — WSG Sound Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #ddd; font-family: monospace; padding: 24px; max-width: 680px; }
h1  { color: #fc0; font-size: 1.3em; margin-bottom: 6px; }
h2  { color: #f80; font-size: 1em; border-bottom: 1px solid #333; padding-bottom: 4px;
      margin-top: 28px; margin-bottom: 10px; }
p   { color: #777; font-size: 0.85em; line-height: 1.5; margin-bottom: 6px; }
code{ color: #aaa; }
.row { display: flex; align-items: center; gap: 12px; margin: 5px 0; }
.lbl { flex: 1; color: #bbb; font-size: 0.9em; }
button {
  background: #222; color: #ccc; border: 1px solid #444;
  padding: 4px 16px; font-family: monospace; cursor: pointer;
  min-width: 48px;
}
button:hover  { background: #444; }
button:active { background: #ddd; color: #000; }
</style>
</head>
<body>

<h1>Ms. Pac-Man — Namco WSG Sound Demo</h1>
<p>Data decoded from <code>scott.asm</code>. 3 channels, 3.072 MHz clock, 60 Hz frame rate.
   Waveforms from the <code>82S126</code> sound PROM dump.</p>

<h2>Songs</h2>
<div id="songs"></div>

<h2>SFX — Channel 1</h2>
<div id="sfx1"></div>

<h2>SFX — Channel 2</h2>
<div id="sfx2"></div>

<h2>SFX — Channel 3</h2>
<div id="sfx3"></div>

<script src="demo.js"></script>
</body>
</html>
